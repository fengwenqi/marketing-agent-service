services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketing_agent
      POSTGRES_USER: marketing_agent
      POSTGRES_PASSWORD: marketing_agent_dev
    ports:
      - "5432:5432"
    volumes:
      - marketing-agent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketing_agent -d marketing_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  marketing-agent-postgres:

